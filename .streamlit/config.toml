# Réglages de l'appli Streamlit.
[server]
address = "localhost"     # appli visible uniquement depuis ce PC (pas depuis le réseau)

[client]
toolbarMode = "minimal"   # pas de bouton « Deploy » : l'appli reste locale

[browser]
gatherUsageStats = false  # pas de statistiques d'usage envoyées à Streamlit

# Thème sobre inspiré d'Apple : police du système, gris doux, bleu d'action, coins arrondis.
# Le mode clair ou sombre suit le réglage de Windows (menu ⋮ > Settings pour le changer).
[theme]
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.9rem"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false

[theme.light]
primaryColor = "#0071e3"
backgroundColor = "#fbfbfd"
secondaryBackgroundColor = "#f2f2f7"
textColor = "#1d1d1f"
borderColor = "#e3e3e8"

[theme.dark]
primaryColor = "#0a84ff"
backgroundColor = "#1c1c1e"
secondaryBackgroundColor = "#2c2c2e"
textColor = "#f5f5f7"
borderColor = "#3a3a3c"
