<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>À trier · Stage Scraper</title>
<link rel="icon" href="/statique/img/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/statique/css/site.css">
<link rel="stylesheet" href="/statique/css/app.css">
<link rel="stylesheet" href="/statique/css/a-trier.css">
<script type="module" src="/statique/js/a-trier.js"></script>
</head>
<body>
<div class="fond uni" aria-hidden="true"></div>

<div class="fenetre verre">
  <aside class="cote">
    <a class="marque" href="/">Stage Scraper</a>
    <button class="scrap" id="scrap" type="button">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
      <span>Lancer le scrap</span>
    </button>
    <nav aria-label="Pages">
      <h2>Mes offres</h2>
      <a class="on" href="/a-trier" aria-current="page">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h4"/></svg>
        À trier<span class="nb" id="nb-a-trier"></span></a>
      <a aria-disabled="true" title="Arrive bientôt dans le nouveau site">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l2.4 5 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4L4.2 9.8 9.6 9z"/></svg>
        Ma sélection<span class="nb" id="nb-selection"></span></a>
      <a aria-disabled="true" title="Arrive bientôt dans le nouveau site">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v10H10l-5 4z"/></svg>
        Assistant<span class="bientot">bientôt</span></a>
      <h2>Plus</h2>
      <a aria-disabled="true" title="Arrive bientôt dans le nouveau site">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
        Réglages<span class="bientot">bientôt</span></a>
      <a aria-disabled="true" title="Arrive bientôt dans le nouveau site">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9l3 3v13H6z"/><path d="M9 11h6M9 15h6"/></svg>
        Journal<span class="bientot">bientôt</span></a>
      <a aria-disabled="true" title="Arrive bientôt dans le nouveau site">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>
        Corbeille<span class="bientot">bientôt</span></a>
    </nav>
    <div class="dernier" id="dernier" aria-live="polite"><b>Chargement…</b></div>
  </aside>

  <main class="principal">
    <div class="barre">
      <div class="sections" role="group" aria-label="Afficher" id="sections"></div>
      <button class="pastille" id="tri" type="button" title="Changer l'ordre des offres">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>
        <span>Plus récentes</span></button>
      <button class="pastille" id="bof" type="button" aria-pressed="false" title="Offres notées moins de 5/10, masquées par défaut">Bof</button>
      <label class="recherche pastille">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
        <span class="sr-only">Rechercher</span>
        <input id="recherche" type="search" placeholder="Rechercher" autocomplete="off">
      </label>
    </div>

    <p class="compte" id="compte" aria-live="polite"></p>

    <div class="scene">
      <button class="cote-g" id="fleche-non" type="button" aria-label="Pas pour moi (flèche gauche)">
        <i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></i>
        <span>Pas pour moi</span></button>
      <div class="pile" id="pile"></div>
      <button class="cote-d" id="fleche-oui" type="button" aria-label="Je candidate (flèche droite)">
        <i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i>
        <span>Je candidate</span></button>
    </div>

    <div class="actions" id="actions">
      <button class="rond non" id="bouton-non" type="button" title="Pas pour moi (←)" aria-label="Pas pour moi">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      <button class="rond petit" id="bouton-tard" type="button" title="Plus tard (↑)" aria-label="Plus tard">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></button>
      <button class="rond oui" id="bouton-oui" type="button" title="Je candidate (→)" aria-label="Je candidate">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </div>
    <p class="aide" id="aide">Glisse la carte, ou utilise ← → au clavier · ↑ pour plus tard · Ctrl+Z pour annuler</p>

    <aside class="fiche" id="fiche" aria-hidden="true" aria-labelledby="fiche-titre" tabindex="-1">
      <div class="fiche-tete">
        <button class="pastille" id="fiche-fermer" type="button">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Retour</button>
      </div>
      <div class="fiche-corps" id="fiche-corps"></div>
    </aside>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
