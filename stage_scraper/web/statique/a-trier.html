<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>À trier · Stage Scraper</title>
<link rel="icon" href="/statique/img/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/statique/css/site.css">
<link rel="stylesheet" href="/statique/css/app.css">
<link rel="stylesheet" href="/statique/css/a-trier.css">
<script type="module" src="/statique/js/a-trier.js"></script>
</head>
<body>
<div class="fond uni" aria-hidden="true"></div>

<div class="fenetre verre">
  <!-- menu -->

  <main class="principal">
    <div class="barre">
      <div class="filtres">
        <button class="pastille bouton-filtres" id="filtres" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-filtres">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span class="libelle" id="filtres-libelle">Toutes les offres</span>
          <small class="nb" id="filtres-nb"></small>
          <span class="details" id="filtres-details"></span>
          <svg class="ic chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="menu-filtres" id="menu-filtres" role="menu" aria-label="Filtres" tabindex="-1"></div>
      </div>
      <label class="recherche pastille">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
        <span class="sr-only">Rechercher</span>
        <input id="recherche" type="search" placeholder="Rechercher" autocomplete="off">
      </label>
    </div>

    <p class="compte" id="compte" aria-live="polite"></p>

    <div class="scene">
      <button class="cote-g" id="fleche-non" type="button" aria-label="Pas intéressé (flèche gauche)">
        <i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></i>
        <span>Pas intéressé</span></button>
      <div class="pile" id="pile"></div>
      <button class="cote-d" id="fleche-oui" type="button" aria-label="Intéressé (flèche droite)">
        <i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i>
        <span>Intéressé</span></button>
    </div>

    <div class="actions" id="actions">
      <button class="rond non" id="bouton-non" type="button" title="Pas intéressé (←)" aria-label="Pas intéressé">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      <button class="rond petit" id="bouton-tard" type="button" title="Plus tard (↑)" aria-label="Plus tard">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></button>
      <button class="rond oui" id="bouton-oui" type="button" title="Intéressé (→)" aria-label="Intéressé">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </div>
    <p class="aide" id="aide">Glisse la carte, ou utilise ← → au clavier · ↑ pour plus tard · Ctrl+Z pour annuler</p>

    <!-- Détails : la carte grossit au centre (View Transition), le reste de la page se voile. -->
    <div class="voile" id="voile" hidden></div>
    <article class="grande" id="grande" role="dialog" aria-modal="true" aria-labelledby="fiche-titre" tabindex="-1" hidden>
      <button class="fermer" id="grande-fermer" type="button" aria-label="Fermer" title="Fermer (Échap)">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="grande-corps fiche-corps" id="grande-corps"></div>
      <div class="grande-pied" id="grande-pied"></div>
    </article>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
