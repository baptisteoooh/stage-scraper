<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant · Stage Scraper</title>
<link rel="icon" href="/statique/img/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/statique/css/site.css">
<link rel="stylesheet" href="/statique/css/app.css">
<link rel="stylesheet" href="/statique/css/assistant.css">
<script type="module" src="/statique/js/assistant.js"></script>
</head>
<body>
<div class="fond uni" aria-hidden="true"></div>

<div class="fenetre verre">
  <!-- menu -->

  <main class="principal">
    <div class="barre">
      <h1 class="titre-page">Assistant</h1>
      <button class="pastille" id="effacer" type="button" hidden>Nouvelle conversation</button>
    </div>
    <div class="defile conversation" id="fil" aria-live="polite"></div>
    <form class="saisie bas" id="saisie">
      <label class="sr-only" for="question">Ta question</label>
      <textarea class="champ" id="question" rows="1" placeholder="Demande une offre, compare-en deux, pose une question…" maxlength="2000"></textarea>
      <button class="bouton principal" id="envoyer" type="submit" aria-label="Envoyer">↑</button>
    </form>
    <p class="mention">Gemini, gratuit · il lit les annonces en entier avant de répondre · Entrée pour envoyer</p>
    <aside class="fiche" id="fiche" aria-hidden="true" aria-labelledby="fiche-titre" tabindex="-1">
      <div class="fiche-tete">
        <button class="pastille" id="fiche-fermer" type="button">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Retour</button>
      </div>
      <div class="fiche-corps" id="fiche-corps"></div>
    </aside>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
